name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  vet-and-test:
    name: Go Vet and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Use Go version from go.mod
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...
